name: Sector module or new topic
description: Propose a sector module, such as credit or investment, or something many implementations need that the draft doesn't cover.
labels: ["proposal"]
body:
    - type: markdown
      attributes:
          value: |
              Check the open points in the [README](https://github.com/OFA-Foundation/open-financial-agent-protocol#open-points) and the existing issues first. If one already covers your idea, add to it there. For a sector module, section 8 of `schema.ts` lists what the module must define.
    - type: dropdown
      id: kind
      attributes:
          label: Kind
          options:
              - New sector module (credit, investment, other)
              - Change to the insurance module
              - Change to the core
              - New topic
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What an agent or a distributor can't do with the draft, with a concrete example.
      validations:
          required: true
    - type: dropdown
      id: who
      attributes:
          label: Who needs it
          multiple: true
          options:
              - Agents
              - Distributors
              - Customers
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed approach
          description: Optional. How it could work, and the laws it must meet.
    - type: textarea
      id: prior-art
      attributes:
          label: Prior art
          description: Optional. Existing protocols or products that solve this, and how OFAP would work with them.
